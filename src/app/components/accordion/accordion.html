<!-- CONTENITORE PRINCIPALE DELL'ACCORDION -->
<div class="accordion-container">
  <h1>Frequently Asked Questions</h1>
  <p>Here are some of the frequently asked questions</p>

  <!-- ELENCO DELLE DOMANDE -->
  @for (item of items; track item.question; let index = $index) {
    <div class="accordion-item">
      <!-- DOMANDA -->
      <button type="button" class="accordion-question" (click)="toggleItem(index)">
        <span>{{ item.question }}</span>
        <span>⌄</span>
      </button>

      <!-- RISPOSTA -->
      @if (openIndex() === index) {
        <div class="accordion-answer">
          <p>{{ item.answer }}</p>
        </div>
      }
    </div>
  }
</div>
